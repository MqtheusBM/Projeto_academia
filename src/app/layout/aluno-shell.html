<div class="min-h-screen bg-gym-bg md:grid md:grid-cols-[240px_1fr]">
  <aside class="hidden md:flex flex-col border-r border-white/5 bg-gym-card p-5">
    <p class="font-[Montserrat] text-xl font-extrabold text-gym-accent">YellowBlack</p>
    <p class="mt-1 text-sm text-gym-muted">Olá, {{ name.split(' ')[0] }}</p>
    <nav class="mt-8 flex flex-col gap-2">
      <a routerLink="/aluno/dashboard" routerLinkActive="bg-gym-accent text-black" class="rounded-xl px-4 py-3 font-semibold text-gym-muted hover:bg-white/5">
        <lucide-icon name="dumbbell" class="inline h-4 w-4"></lucide-icon> Hoje
      </a>
      <a routerLink="/aluno/treinos" routerLinkActive="bg-gym-accent text-black" class="rounded-xl px-4 py-3 font-semibold text-gym-muted hover:bg-white/5">
        <lucide-icon name="calendar-days" class="inline h-4 w-4"></lucide-icon> Treinos
      </a>
      <a routerLink="/aluno/evolucao" routerLinkActive="bg-gym-accent text-black" class="rounded-xl px-4 py-3 font-semibold text-gym-muted hover:bg-white/5">
        <lucide-icon name="activity" class="inline h-4 w-4"></lucide-icon> Evolução
      </a>
      <a routerLink="/aluno/suporte" routerLinkActive="bg-gym-accent text-black" class="rounded-xl px-4 py-3 font-semibold text-gym-muted hover:bg-white/5">
        <lucide-icon name="life-buoy" class="inline h-4 w-4"></lucide-icon> Suporte
      </a>
    </nav>
    <button class="mt-auto rounded-xl px-4 py-3 text-left text-gym-muted hover:bg-white/5" (click)="logout()">
      <lucide-icon name="log-out" class="inline h-4 w-4"></lucide-icon> Sair
    </button>
  </aside>

  <div class="pb-24 md:pb-0">
    <router-outlet />
  </div>

  <nav class="md:hidden fixed bottom-0 inset-x-0 grid grid-cols-5 border-t border-white/10 bg-gym-card">
    <a routerLink="/aluno/dashboard" routerLinkActive="text-gym-accent" class="py-3 text-center text-xs text-gym-muted">Hoje</a>
    <a routerLink="/aluno/treinos" routerLinkActive="text-gym-accent" class="py-3 text-center text-xs text-gym-muted">Treinos</a>
    <a routerLink="/aluno/evolucao" routerLinkActive="text-gym-accent" class="py-3 text-center text-xs text-gym-muted">Evolução</a>
    <a routerLink="/aluno/suporte" routerLinkActive="text-gym-accent" class="py-3 text-center text-xs text-gym-muted">Suporte</a>
    <button class="py-3 text-xs text-gym-muted" (click)="logout()">Sair</button>
  </nav>
</div>
